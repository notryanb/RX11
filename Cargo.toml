[package]
name = "rx11"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rx11_standalone"
path = "src/main.rs"

[lib]
# The `lib` artifact is needed for the standalone target
crate-type = ["cdylib", "lib"]

[workspace]
members = ["xtask"]

# Enable a small amount of optimization in the dev profile.
# [profile.dev]
# opt-level = 1

# Enable more optimization in the release profile at the cost of compile time.
# [profile.release]
# codegen-units = 1
# lto = "thin"
# # (optional) helps reduce binary size
# strip = "symbols"

# [profile.profiling]
# inherits = "release"
# debug = true
# strip = "none"

[dependencies]
baseview = { version = "0.1.1", features = ["opengl"] }
parking_lot = "0.12"
egui = { version = "0.35.0", default-features = false, features = ["bytemuck"] }
nice-plug = { version = "0.1", features = ["assert_process_allocs", "standalone"] }
nice-plug-egui = "0.2.0"
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["registry"] }

